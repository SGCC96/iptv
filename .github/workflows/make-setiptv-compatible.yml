name: Make SETIPTV Compatible Playlist

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Turkish + Dutch IPTV"]
    types: [completed]

permissions:
  contents: write

jobs:
  sanitize:
    # Only sanitize after a successful source-playlist build.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download sanitizer
        run: |
          test -f sanitize_setiptv.py

      - name: Create strict SETIPTV playlist
        run: |
          python sanitize_setiptv.py

      - name: Commit SETIPTV playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turks_nederland_setiptv.m3u setiptv_validation.txt
          git diff --cached --quiet || git commit -m "Create SETIPTV-compatible playlist"
          git push
