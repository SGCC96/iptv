name: Update Turkish + Dutch IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download builder
        run: |
          test -f build_turk_nl.py

      - name: Build and probe
        run: |
          python build_turk_nl.py --probe --workers 12

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turks_nederland_verified.m3u turks_nederland_validation.txt
          git diff --cached --quiet || git commit -m "Update Turkish and Dutch verified playlist"
          git push
